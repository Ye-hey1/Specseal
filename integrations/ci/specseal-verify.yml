# Specseal verify 门禁 — GitHub Actions 模板（下游项目用）。
#
# 推荐方式：直接引用本仓库的 composite action（一行接入，无需复制脚本）。
# 把本文件放进你的项目 .github/workflows/specseal-verify.yml：
#
#   action 会做两件事：
#     1. `speclink validate`——工作区结构校验（格式错的 proposal / 缺复选框的
#        tasks.md / 缺操作段落的 delta 都会让 PR 失败）
#     2. 盖章门禁——PR diff 触及的每个未归档变更必须已有 verify 章
#        （.meta.yaml 的 verified_at，与桌面 app / Herdr 面板同源）；
#        require-reviewed: true 时还要求 review 章。
#
#   自定义：
#     install-engine: false   # runner 上已装好 speclink 时跳过 npm 安装
#     require-reviewed: true  # 连 review 章一起要求
#     changes: "a b"          # 显式指定要门禁的变更，默认取 PR diff 触及的

name: specseal-verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 盖章门禁要对比 PR 与基准分支的 diff；给足深度
          fetch-depth: 0

      - uses: Ye-hey1/Specseal/.github/actions/specseal-verify@main
        with:
          install-engine: true

      # 可选：依赖波次健全性检查
      - name: Plan
        run: speclink plan

