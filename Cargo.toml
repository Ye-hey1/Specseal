[workspace]
resolver = "2"
members = ["crates/engine/specseal-core", "crates/engine/specseal-fs", "crates/protocol/specseal-protocol", "crates/protocol/specseal-remote", "crates/adapters/specseal-cli", "crates/adapters/specseal-node", "crates/adapters/specseal-verbs", "crates/store/specseal-store", "crates/store/specseal-store-sqlite", "crates/store/specseal-store-fs", "crates/store/specseal-store-postgres", "crates/store/specseal-store-port", "crates/host/specseal-host", "crates/host/specseal-server", "apps/desktop/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MomoChenisMe/speclink"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ulid = "1.2"

[profile.dev]
debug = false
