<!doctype html>
<html lang="zh-Hant" style="background: transparent">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specseal Tray Panel</title>
    <style>
      /* vibrancy 透出＋原生手感：背景透明、内容不可选取。卷动面收敛于面板
         中段容器（三段式版面）——body 不再卷动，rubber-band 防护随卷动面
         移入中段（TrayPanel 的 overscroll-none）。 */
      html,
      body {
        background: transparent !important;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
    </style>
  </head>
  <body style="background: transparent">
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
