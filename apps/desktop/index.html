<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo-mark.png" />
    <title>Specseal</title>
    <script>
      // 外观偏好（desktop-settings-mode design D4）：首次绘制前套上 data-theme，避免先闪一次系统主题。
      // 键与合法值同 @specseal/ui 的 theme.ts；读不到即跟随系统。
      try {
        var pref = localStorage.getItem("specseal.theme");
        if (pref === "light" || pref === "dark") document.documentElement.setAttribute("data-theme", pref);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
