[package]
name = "specseal-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
specseal-core = { path = "../../../crates/engine/specseal-core" }
specseal-fs = { path = "../../../crates/engine/specseal-fs" }
specseal-host = { path = "../../../crates/host/specseal-host" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
regex = { workspace = true }

[dev-dependencies]
# 测试借 core 的 testkit（技能档版号读写 helper）；feature 只在 dev 构建生效。
specseal-core = { path = "../../../crates/engine/specseal-core", features = ["testkit"] }
