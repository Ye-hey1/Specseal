[package]
name = "specseal-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The official Specseal HTTP server: an axum adapter that serves the Client Protocol over the Host → Engine → TeamStore path"

[[bin]]
name = "specseal-server"
path = "src/main.rs"

[dependencies]
specseal-host = { path = "../specseal-host" }
specseal-protocol = { path = "../../protocol/specseal-protocol" }
specseal-store = { path = "../../store/specseal-store" }
specseal-store-sqlite = { path = "../../store/specseal-store-sqlite" }
specseal-store-fs = { path = "../../store/specseal-store-fs" }
specseal-store-postgres = { path = "../../store/specseal-store-postgres" }
axum = "0.8"
async-stream = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
tar = "0.4"
tempfile = "3"
chrono = { workspace = true }
# 内嵌 apps/server-web 的 Vite production build（D5）：debug 动态读取 dist，
# release 于编译期内嵌——缺 dist 时 release build fail closed。
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
specseal-core = { path = "../../engine/specseal-core" }
specseal-fs = { path = "../../engine/specseal-fs" }
postgres = "0.19.14"
specseal-remote = { path = "../../protocol/specseal-remote" }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

# Needs a real PostgreSQL instance, so it runs its own harness to report
# `skipped` rather than `passed` when none is configured. See tests/pg/mod.rs.
[[test]]
name = "postgres_store"
harness = false
