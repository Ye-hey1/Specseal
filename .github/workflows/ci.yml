name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tauri crates joined the workspace — Linux builds need the GTK/WebKit stack.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Smoke only needs the CLI; the full workspace compiles once via cargo test below.
      - name: Build (release)
        run: cargo build --release --locked -p speclink-cli

      - name: Smoke test (init → new → artifact → status → validate)
        shell: bash
        run: |
          BIN="$PWD/target/release/speclink"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          mkdir smoke && cd smoke
          git init -q
          git config user.name CI
          git config user.email ci@example.com
          "$BIN" init . --tools claude,codex
          test -f .claude/skills/speclink-propose/SKILL.md
          test -f .agents/skills/speclink-propose/SKILL.md
          "$BIN" new change smoke-test --agent claude
          printf '## Why\nSmoke test\n## Impact\n- none\n' | "$BIN" new artifact proposal --change smoke-test --stdin
          "$BIN" status --change smoke-test
          "$BIN" validate smoke-test
          "$BIN" list
          "$BIN" schemas
          "$BIN" update

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies (root workspaces)
        id: npm-ci
        run: npm ci

      # scripts/ 的测试面守的是「设置本身」的契约——workflow 步骤顺序、release
      # 产物组装、签章闸门、交付 gate。它零外部依赖且不到一秒，排在其他测试面之前
      # 就能在跑满建置前先挡下设置破损。
      #
      # 这里用 bash 展开 glob 而非交给 node：--test 的 glob 展开是 Node 21 才有的
      # 能力，本 job 钉选 Node 20；Windows runner 的缺省 shell 也不展开 glob。
      - name: Test (scripts)
        shell: bash
        run: node --test scripts/*.test.mjs scripts/*/*.test.mjs

      # 前一个测试面红了，后面的照跑：一轮就看到全部失败，不用修一个、重跑一轮才看到下一个。
      # 只有依赖没装成（或更早的建置失败让它被跳过）才不跑，那时跑了只会多出噪音。
      - name: Test (UI)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm test -w packages/ui

      - name: Test (Desktop)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm test -w apps/desktop

      - name: Test (Server Web)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm test -w apps/server-web

      # 两个前端 production build 都必须在 cargo test 之前完成：desktop 供
      # tauri::generate_context! 于编译期内嵌 frontendDist；server-web 供
      # speclink-server 的 compile-time asset embedding。Rust 的 embedded asset／
      # route 测试才会验到当次 source 产出的 index 与 manifest，而非过期产物。
      - name: Build desktop frontend (vite → dist)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run build -w apps/desktop

      - name: Build server-web frontend (vite → dist)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run build -w apps/server-web

      # speclink-desktop 的 build script 于编译期检查 tauri.conf.json 的 externalBin
      # 是否就位，而 binaries/ 是 gitignored——没布 sidecar 的话 cargo test 会死在
      # build script（不是测试红字，是整个 crate 编不动）。CLI 上面已建过 release，
      # 这一步只是重用产物再拷贝到 target-triple 命名位置。
      - name: Stage CLI sidecar (desktop externalBin)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node scripts/desktop/desktop-sidecar.mjs

      - name: Test (Rust workspace)
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: cargo test --workspace --locked

  # Phase 3 收官剧本独立计时、独立失败现场；不藏在 workspace 单元测试里。
  phase3-e2e:
    runs-on: ubuntu-latest
    env:
      PHASE3_E2E_ARTIFACT_DIR: target/phase3-e2e-artifacts
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # 两份 dist 都要：desktop 供 tauri::generate_context! 内嵌 frontendDist；
      # server-web 供 speclink-server 的 asset embedding——desktop 的 dev-dependencies
      # 带 speclink-server，phase3 剧本正是拿它起真 server，缺 dist 则 RustEmbed
      # 于编译期失败。
      - name: Build frontends (desktop + server-web)
        run: |
          npm ci
          npm run build -w apps/desktop
          npm run build -w apps/server-web

      # externalBin 的编译期存在性检查，同 build-and-smoke；此 job 没有现成的
      # release CLI，故这一步自己建。
      - name: Stage CLI sidecar (desktop externalBin)
        run: node scripts/desktop/desktop-sidecar.mjs

      - name: Test Phase 3 continuous chain
        shell: bash
        run: |
          mkdir -p "$PHASE3_E2E_ARTIFACT_DIR"
          set -o pipefail
          cargo test --locked -p speclink-desktop --test it -- phase3_chain:: --nocapture 2>&1 \
            | tee "$PHASE3_E2E_ARTIFACT_DIR/test-output.log"

      - name: Upload Phase 3 failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase3-e2e-failure-${{ runner.os }}
          path: target/phase3-e2e-artifacts/
          if-no-files-found: warn

  # Docker 冒烟（server-release spec）：映像 build 得起来只是下限——起得来、
  # /healthz 与 /readyz 皆 2xx、logs 印 setup token、坏组态 fail closed 以非零
  # exit code 结束，四件事都验到才算。两份 compose 档的语法验证也挂在这里。
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f crates/host/speclink-server/Dockerfile -t speclink-server:smoke .

      - name: Compose 档语法验证
        env:
          # postgres compose 对缺密码设计成大声失败（${VAR:?}），语法验证给假值通过。
          SPECLINK_POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.postgres.yml config --quiet

      # 语法过不代表起得来，这一步验真正的 compose 路径。
      #
      # --build 是必要的，不是保险：compose 对 image: 是「先 pull、失败才 build」。
      # 今天 ghcr 上还没有 :latest（pull 403 → 回退建置）所以看起来会过，但首次
      # 正式发版推出 :latest 的那天，这一步会改拉已发布映像、不再建置本 commit 的
      # 原代码——测的东西被无声掉包。--build 让它永远建置受测原代码。
      - name: 冒烟 — SQLite compose 一行开箱
        shell: bash
        working-directory: deploy
        run: |
          docker compose up -d --build
          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/readyz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::compose 起的 server 未在 60 秒内就绪"
            docker compose logs
            exit 1
          fi
          if ! docker compose logs server | grep -Eq 'setup\?token=[A-Za-z0-9_]+'; then
            echo "::error::compose logs 没有一次性 setup token 行"
            docker compose logs
            exit 1
          fi
          docker compose down -v

      - name: 冒烟 — 起容器（SQLite 组态）→ /healthz、/readyz → setup token 行
        shell: bash
        run: |
          docker run -d --name smoke -p 8080:8080 speclink-server:smoke
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz \
               && curl -fsS -o /dev/null http://127.0.0.1:8080/readyz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::/healthz 或 /readyz 未在 30 秒内回 2xx"
            docker logs smoke
            exit 1
          fi
          if ! docker logs smoke | grep -Eq 'setup\?token=[A-Za-z0-9_]+'; then
            echo "::error::logs 没有一次性 setup token 行"
            docker logs smoke
            exit 1
          fi
          docker stop smoke

      # spec 的 THEN 有两句：非零 exit code「且」不绑定连接端口。后者在容器退出后
      # 无法用 curl 观察——端口映射随容器一起拆掉，那种断言恒真、是假覆盖。改以
      # 启动顺序的可观察代理来验：main.rs 的顺序是 config → store → identity →
      # setup token → bind，所以「死在 config 阶段」＋「没印出 token 行」即证明
      # 运行从未走到 bind。
      - name: 坏组态容器即死（fail closed，且未走到 bind）
        shell: bash
        run: |
          printf 'store: [unclosed\n' > bad-config.yaml
          docker run -d --name badcfg \
            -v "$PWD/bad-config.yaml:/etc/speclink/config.yaml:ro" speclink-server:smoke
          for _ in $(seq 1 15); do
            st=$(docker inspect -f '{{.State.Status}}' badcfg)
            [ "$st" = "exited" ] && break
            sleep 1
          done
          if [ "$(docker inspect -f '{{.State.Status}}' badcfg)" != "exited" ]; then
            echo "::error::坏组态容器 15 秒内未退出——启动守门失效"
            docker logs badcfg
            exit 1
          fi
          rc=$(docker inspect -f '{{.State.ExitCode}}' badcfg)
          docker logs badcfg || true
          if [ "$rc" -eq 0 ]; then
            echo "::error::坏组态容器以 0 退出——fail closed 失效"
            exit 1
          fi
          if ! docker logs badcfg 2>&1 | grep -q 'cannot parse config file'; then
            echo "::error::非零退出但不是因为组态解析失败——守门的把关点跑掉了"
            exit 1
          fi
          if docker logs badcfg 2>&1 | grep -q 'setup?token='; then
            echo "::error::坏组态下仍铸出 setup token——运行走过了 config 守门"
            exit 1
          fi

  # The PostgreSQL driver needs a real database, which `services` can only give
  # a Linux runner — hence a job of its own rather than a step in the matrix
  # above. There, with no SPECLINK_TEST_POSTGRES_URL set, those suites report
  # `skipped` and the matrix stays green on machines without a database.
  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The supported floor. The driver uses nothing newer, and the floor is
        # what CI must prove, so this pins the version rather than tracking
        # latest.
        image: postgres:15
        env:
          POSTGRES_PASSWORD: speclink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPECLINK_TEST_POSTGRES_URL: postgres://postgres:speclink@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # 这个 job 也编 speclink-server，其 lib 于编译期内嵌 apps/server-web/dist
      # （gitignored）。没有这一步，postgres 套件根本走不到测试就编译失败。
      - name: Build server-web frontend (vite → dist)
        run: |
          npm ci
          npm run build -w apps/server-web

      - name: Test (postgres driver, and the server over it)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p speclink-store-postgres 2>&1 | tee postgres-suites.log
          cargo test --locked -p speclink-server --test postgres_store 2>&1 | tee -a postgres-suites.log

      # The suites skip rather than fail when no database is configured — right
      # on a developer's laptop, useless here. Without this, a typo in the URL
      # or a service that never came up would leave this job green having run
      # nothing at all.
      - name: Guard — the suites must have actually run
        shell: bash
        run: |
          if grep -q 'skipped' postgres-suites.log; then
            echo "::error::the PostgreSQL suites reported skipped — the service or SPECLINK_TEST_POSTGRES_URL never reached them, so nothing was tested"
            exit 1
          fi
