name: Node SDK

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/node-sdk.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/node-sdk.yml'
  # 同档双角色（设计 D1）：push／PR 是 CI 验证（无 version，占位版号打包），
  # release.yml 以 workflow_call 带 tag 版重用同一份 build/pack，盖章后的
  # npm-tarballs artifact 因属同一 workflow run 而能被 caller 的后续 job 下载。
  workflow_call:
    inputs:
      version:
        description: '发布版号（X.Y.Z，不带 v 前缀）；留空则以 repo 内占位版号打包'
        required: false
        type: string

defaults:
  run:
    working-directory: crates/adapters/speclink-node

jobs:
  build:
    name: build ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - host: macos-latest
            target: x86_64-apple-darwin
            test: false # macos-latest runners are arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            test: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            test: false # cross-compiled, not runnable on the x64 host
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross toolchain
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Build native module (release)
        run: npm run build:release -- --target ${{ matrix.settings.target }}

      # engine.spec 的 CLI parity 测试需要 speclink binary；与 napi release build 共用编译产物。
      - name: Build the CLI for parity tests (release)
        if: matrix.settings.test
        working-directory: .
        run: cargo build --release -p speclink-cli --locked

      - name: Test against the native-arch build
        if: matrix.settings.test
        run: npm test

      - name: Upload platform binary
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/adapters/speclink-node/*.node
          if-no-files-found: error

      # binding.js 是 napi build 产生的 loader，被 .gitignore 忽略，但主套件的
      # files 列了它——pack job 不重新建置，所以这里带一份出去。它只依 platform／
      # arch 分派、与 target 无关，因此固定从一个 target 上传一份即可。
      - name: Upload the generated JS loader
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: binding-js
          path: crates/adapters/speclink-node/binding.js
          if-no-files-found: error

  package:
    name: package npm tarballs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Create platform sub-package directories
        run: npx napi create-npm-dir -t .

      # pattern 圈定：被 release.yml 以 workflow_call 重用时，本 job 与 caller 属
      # 同一个 run，不圈定会把 server-*／desktop-* 等 artifact 一起灌进 napi 的
      # 扫描目录。
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: crates/adapters/speclink-node/artifacts

      - name: Distribute binaries into sub-packages
        run: npx napi artifacts

      # binding.js 只由 napi build 产生、不在 repo 内，而主套件的 files 列了它：
      # 少了它 npm pack 会静默略过，发出去的套件一 require 就 MODULE_NOT_FOUND。
      - name: Restore the generated JS loader
        uses: actions/download-artifact@v4
        with:
          name: binding-js
          path: crates/adapters/speclink-node

      # 版号盖章（设计 D2）：只在 workflow_call 带 version 时运行，把 tag 版写进主
      # 套件与全部平台子套件并物化 optionalDependencies。push／PR 无此输入即跳过，
      # 打包行为与导入 workflow_call 前完全一致。版号经 env 传入而非内插进 run:
      # ——tag 名可含引号与分号，内插等于把 tag 名当 shell 原代码跑。
      - name: Stamp the release version onto the package family
        if: inputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/npm/npm-engine-package.mjs --version "$VERSION" --dir crates/adapters/speclink-node

      - name: Pack the main package and every platform sub-package
        run: |
          npm pack
          for dir in npm/*/; do
            (cd "$dir" && npm pack)
          done
          ls -l ./*.tgz npm/*/*.tgz
          # fail closed：主套件少了 binding.js 照样打包成功，但装起来是坏的。
          main_tgz="$(ls ./*.tgz)"
          tar -tzf "$main_tgz" | grep -qx 'package/binding.js' \
            || { echo "::error::主套件 tarball 缺 binding.js（loader 未取回）"; exit 1; }
          # 同一道保险要对称：napi artifacts 找不到相符文件名时是静默 return，
          # 少了这里就会打包出「只有 package.json」的子套件，全绿发上 npm。
          for tgz in npm/*/*.tgz; do
            tar -tzf "$tgz" | grep -q '\.node$' \
              || { echo "::error::子套件 tarball $tgz 缺 .node（napi artifacts 没分配到二进位）"; exit 1; }
          done

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: |
            crates/adapters/speclink-node/*.tgz
            crates/adapters/speclink-node/npm/*/*.tgz
          if-no-files-found: error
