# Release: push a tag like `v0.1.0` and this builds speclink (CLI) and speclink-server
# for Windows / Linux / macOS (x86_64 + arm64 where applicable), desktop installers
# (macOS universal dmg / Windows NSIS / Linux AppImage, each bundling the same-version
# CLI as a Tauri sidecar) plus the updater manifest latest.json, publishes a GitHub
# Release with exactly those six assets attached, publishes the CLI to npm (the single
# binary source for npm / Homebrew / install.sh), and pushes the server Docker image
# to ghcr.
#
# Desktop signing (design D3/D4):
#   - Updater packages are minisign-signed with TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)
#     secrets — REQUIRED; the desktop build fails closed without them.
#   - OS code signing (Apple/Windows) is env-gated: the corresponding steps run only
#     when their secrets exist. No secrets → unsigned installers, workflow stays green.
#
# Usage:
#   运行 /release 技能（.claude/skills/release/SKILL.md）：守门、版号、更新日志、写档、
#   commit、附注 tag 与 push 一次做完；tag 推上来之后由本 workflow 接手。
#
# Note: the `ubuntu-24.04-arm` runner is free for PUBLIC repositories only — remove that
# matrix entry (or switch to `cross`) if the repo is private.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # server image 的正典名（ghcr 要求小写；per-arch digest 推送与 manifest 合并共用）。
  REGISTRY_IMAGE: ghcr.io/momochenisme/speclink-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # smoke: 该 target 是否能在自身 runner 上原生运行（决定是否跑 server SPA
        # smoke）。交叉编译的 macOS Intel 在 arm64 runner 上不可原生运行，故跳过。
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            smoke: true
          - os: ubuntu-22.04            # older glibc baseline for wide compatibility
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true
          - os: macos-latest            # Apple Silicon
            target: aarch64-apple-darwin
            smoke: true
          - os: macos-latest            # Intel (cross-compiled; clang handles the bundled SQLite C)
            target: x86_64-apple-darwin
            smoke: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # server binary 于编译期内嵌 apps/server-web 的 production dist（设计 D5），
      # 故 dist 必须在 cargo build 之前产出。建置顺序固定为 npm ci（lockfile）→
      # Web test → Web production build → 编译 server；每个 release binary 因此都
      # 通过同一次 source revision 的 Web 验证并携带对齐版本的内嵌资产。缺 index／
      # manifest 时 Rust 内嵌会 fail closed，不会产生只有 API 没有 UI 的 artifact。
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies (root workspaces)
        run: npm ci

      - name: Test (Server Web)
        run: npm test -w apps/server-web

      - name: Build server-web frontend (vite → dist)
        run: npm run build -w apps/server-web

      # 只建置要发布的两支 binary。全 workspace 建置会把 tauri crate 一起拖进来，
      # 而它需要 GTK/WebKit 系统库与先行的 vite build（见 ci.yml），此 job 的
      # runner 都没有——桌面安装档由独立的 desktop job 产出。
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p speclink-cli -p speclink-server

      # server-release smoke：把 release binary 放进「没有相邻 dist」的干净工作目录
      # 启动，证明 SPA 只能来自 binary 内嵌——GET /login 加载内嵌 index（HTML），
      # 未知 /api 路径回真正的 JSON 404、不被 SPA fallback 吞成 200 HTML。交叉编译
      # target（在异架 runner 上不可原生运行）跳过此步。
      - name: Server SPA smoke（无相邻 dist 加载内嵌 index）
        if: matrix.smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/speclink-server"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          # 刻意独立、无任何 dist 的工作目录：资产只能出自 binary 内嵌。
          rm -rf smoke-runtime && mkdir -p smoke-runtime
          printf 'store:\n  driver: sqlite\n  path: smoke-runtime/store.db\nidentity:\n  driver: sqlite\n  path: smoke-runtime/identity.db\n' > smoke-runtime/config.yaml
          "./$BIN" --config smoke-runtime/config.yaml --addr 127.0.0.1:8188 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8188/login; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "::error::server 未在 30 秒内于无 dist 环境回应 /login"; exit 1; }
          # /login 回内嵌 SPA index：必须是 HTML，而非 404 或空。
          login_ctype="$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8188/login)"
          echo "$login_ctype" | grep -qi 'text/html' \
            || { echo "::error::/login 未回 HTML（内嵌 index 未加载）：$login_ctype"; exit 1; }
          # 未知 browser API 应为 JSON 404，禁止被 catch-all fallback 变成 200 HTML。
          miss_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8188/api/speclink/v1/web/missing)"
          miss_ctype="$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8188/api/speclink/v1/web/missing)"
          [ "$miss_code" = "404" ] \
            || { echo "::error::未知 /api 未回 404（实际 $miss_code）"; exit 1; }
          echo "$miss_ctype" | grep -qi 'application/json' \
            || { echo "::error::/api 404 非 JSON（$miss_ctype）"; exit 1; }

      # 两支 binary 都不进 Release assets：CLI 的通路收敛为 npm（cli-distribution spec
      # 「CLI 以 npm 套件发布」；设计 D4／D8），server 为 Docker＋npm（设计 D6）。上面
      # 仍建置并冒烟作品质闸门；raw binary 以独立 artifact 交给各自的 npm 发布 job 物化。
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/speclink${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error

      # server binary 同形：release job 的 dist 收集以 pattern 圈定，cli-*／server-* 都捞不到。
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/speclink-server${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error

  # 桌面安装档（desktop-release spec；design D1：沿用自组 matrix，不用 tauri-action）：
  # macOS universal dmg（Apple Silicon 与 Intel 同一档）、Windows NSIS（x86_64）、
  # Linux AppImage（x86_64／aarch64）。每个 target 上传两个 artifact：
  #   - desktop-<target>：要附上 Release 的安装档
  #   - updater-<platform>：更新包＋minisign 签章（release job 据此组 latest.json，再把
  #     更新包本体补进 Release assets、.sig 留在 job 内——签章内容已内嵌 latest.json；
  #     Windows／AppImage 的更新包即安装档本身，重复上传换取组装契约单纯）
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 出 universal（设计 D2）：一个 dmg 与一个更新包同时跑 Apple Silicon 与
          # Intel，访客不必分辨芯片。Tauri 的 universal target 要求两个 rustup target 都
          # 装好（rust_targets），sidecar 由 desktop-sidecar.mjs 对两架构各建一次再以
          # lipo 合成。bundles 仍要带 app：Tauri 只为 app／appimage／msi／nsis 产出
          # 更新包，dmg 不在其列——只建 dmg 时 bundler 印一行警告就跳过更新包，且把
          # 中间产物 Speclink.app 清掉，下方收集步骤的 cp 随即找不到 app.tar.gz。
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            platform: darwin-universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            platform: windows-x86_64
          # Linux 只出 AppImage（设计 D7）：它同时是安装档与更新包，任何发行版可用。
          - os: ubuntu-22.04            # older glibc baseline for wide compatibility
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 版本闸门（fail-closed）：tag、tauri.conf.json、release-notes.json 顶端三者同版，
      # 且 CHANGELOG.md、CHANGELOG.zh-TW.md 两份都与 JSON 重算一致（release-notes spec
      # 「release 管线守门版号四处同版与渲染一致」）。版号不齐即红灯——否则 latest.json
      # 声明 tag 版、安装档与 app 自报版本停在旧版，形成每次启动都劝诱安装同一 build 的
      # 无尽更新循环（spec「描述档字段对齐发布内容」）；更新日志落后则 Release 说明与
      # 桌面弹窗都拿不到这版内容。
      # 排在所有建置之前：十分钟建置之后才红灯是浪费。
      - name: Assert release version and changelog consistency
        shell: bash
        run: |
          CONF_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          NOTES_VERSION="$(node -p "require('./apps/desktop/src/release-notes/release-notes.json')[0].version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tauri.conf.json version（${CONF_VERSION}）与 tag（${TAG_VERSION}）不一致——先 bump 版本再发 tag"
            exit 1
          fi
          if [ "$NOTES_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::release-notes.json 顶端 version（${NOTES_VERSION}）与 tag（${TAG_VERSION}）不一致——先运行 /release 技能补上更新日志再发 tag"
            exit 1
          fi
          if ! node scripts/release/release-notes-render.mjs --check; then
            echo "::error::CHANGELOG.md 或 CHANGELOG.zh-TW.md 与 release-notes.json 重算结果不一致（--check 两份都比对，漂移的文件名与差异见上方输出）——运行 node scripts/release/release-notes-render.mjs --write 后提交 CHANGELOG.md 与 CHANGELOG.zh-TW.md 两份"
            exit 1
          fi

      # 签章 secrets 闸门（design D1）：每组 secrets 全有全无——全无即跳过该路径、
      # workflow 照常全绿；部分存在即以列出缺项名称的错误失败，不产出半套签章的
      # 安装档（「已签章但未公证」照样被 Gatekeeper 拦，却让人误以为已完成）。
      # 决策写入 GITHUB_ENV 供下方签章步骤判断，两处不再各自推导 secrets 是否存在。
      # 排在昂贵步骤之前：设置错误要在建置前就红灯，而非跑完五个 target 才发现。
      - name: Signing secrets gate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node scripts/release/signing-gate.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      # 援引 ci.yml 的 Tauri Linux 依赖清单；另补 AppImage 打包工具所需的 FUSE
      # （22.04 为 libfuse2、24.04 改名 libfuse2t64，择一存在）。
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          # AppImage 的 bundler 会调用 xdg-open：ubuntu-24.04-arm 映像未内置
          # xdg-utils（22.04 有），缺了会在打包最后一步才失败。
          sudo apt-get install -y xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies (root workspaces)
        run: npm ci

      # tauri.conf.json 无 beforeBuildCommand（项目惯例：desktop 前端手动 build），
      # 故 dist 必须在 tauri build 之前显式产出。
      - name: Build desktop frontend (vite → dist)
        run: npm run build -w apps/desktop

      # CLI sidecar（design D5）：把同版 speclink CLI 布到 externalBin 要求的
      # target-triple 命名位置；缺档时 tauri build 直接失败（fail-closed）。
      - name: Stage CLI sidecar
        run: node scripts/desktop/desktop-sidecar.mjs --target ${{ matrix.target }}

      # OS 签章开关（design D1／D4）：条件来自上方闸门的决策，填钥匙即激活、
      # 无须改管线。macOS 六项一次注入——凭证三项让 Tauri 签章，公证三项让它在
      # 签章后送 Apple 公证并 staple 票证；少了公证，签过的 app 一样被 Gatekeeper 拦。
      - name: Enable macOS code signing and notarization (env-gated)
        if: runner.os == 'macOS' && env.SPECLINK_MACOS_SIGNING == 'full'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # Windows 仅本机凭证路径（SignPath 裁定不采用，design D2）；secrets 缺席
      # 即产出未签章安装档。
      - name: Enable Windows code signing (env-gated)
        if: runner.os == 'Windows' && env.SPECLINK_WINDOWS_SIGNING == 'certificate'
        shell: bash
        run: |
          {
            echo "WINDOWS_CERTIFICATE=${{ secrets.WINDOWS_CERTIFICATE }}"
            echo "WINDOWS_CERTIFICATE_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # 更新包签章（design D3）：TAURI_SIGNING_* 为必要 secrets——缺席时建置以
      # 非零结束（desktop-release spec「缺私钥时建置失败」），与 OS 签章正交。
      - name: Build desktop bundles (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run -w apps/desktop tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 布署收集：installers/ 进 Release assets；updater/<platform>/ 供 latest.json
      # 组装（每个更新包目录恰一更新包＋同名 .sig——scripts/release/release-latest-json.mjs
      # 的目录契约；darwin-universal 一个目录喂 darwin-aarch64 与 darwin-x86_64 两键）。
      # macOS 更新包原名不含架构，改名带 universal 与 dmg 对称。.sig 只进 updater/，
      # 不进 installers/——它在发布后零读者。
      - name: Collect installers and updater packages
        shell: bash
        run: |
          VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          UPDATER="updater/${{ matrix.platform }}"
          mkdir -p installers "$UPDATER"
          case "${{ matrix.platform }}" in
            darwin-universal)
              cp "$BUNDLE"/dmg/*.dmg installers/
              cp "$BUNDLE/macos/Speclink.app.tar.gz" "$UPDATER/Speclink_${VERSION}_universal.app.tar.gz"
              cp "$BUNDLE/macos/Speclink.app.tar.gz.sig" "$UPDATER/Speclink_${VERSION}_universal.app.tar.gz.sig"
              ;;
            windows-*)
              cp "$BUNDLE"/nsis/*-setup.exe installers/
              cp "$BUNDLE"/nsis/*-setup.exe "$UPDATER"/
              cp "$BUNDLE"/nsis/*-setup.exe.sig "$UPDATER"/
              ;;
            linux-*)
              cp "$BUNDLE"/appimage/*.AppImage installers/
              cp "$BUNDLE"/appimage/*.AppImage "$UPDATER"/
              cp "$BUNDLE"/appimage/*.AppImage.sig "$UPDATER"/
              ;;
          esac
          ls -R installers updater

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          path: updater/${{ matrix.platform }}/*
          if-no-files-found: error

  # server Docker image → ghcr，tag 对齐 release 版本（v0.1.0 → 0.1.0，semver
  # 亦自动附 latest）。两架构经 qemu 仿真建置——arm64 的 Rust 编译在仿真下偏慢，
  # 属已知代价（设计明订先不做多架构矩阵优化）。
  # docker 逐架构原生分开建（设计 D10）：amd64／arm64 各在自己的原生 runner 建置
  # （零 QEMU——仿真下的 Rust 编译单跑逾 35 分钟且是 SIGILL flaky 的根源），
  # push by digest 不打 tag；tag 由 docker-manifest 合并 job 统一打。
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 会把 owner 范式为小写（ghcr 要求）；此处只取 labels，
      # tag 留给合并 job。
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: crates/host/speclink-server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 两架构 digest 都成功才打 tag（版本＋major.minor＋latest）——发布原子性由本
  # job 承担，等价于原单一 job 的全有全无语意。
  docker-manifest:
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          ref_args=()
          for digest in *; do ref_args+=("${{ env.REGISTRY_IMAGE }}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${ref_args[@]}"

      - name: Inspect manifest（两架构齐备才算数）
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}" | tee inspect.txt
          if ! grep -q "linux/amd64" inspect.txt || ! grep -q "linux/arm64" inspect.txt; then
            echo "::error::manifest 缺架构"
            exit 1
          fi

  # 部署文档对用户承诺「每个 release tag 同时产出全部形态」，所以任一形态
  # 失败时不该还发出一个缺形态的 Release——needs 纳入 build、desktop 与 docker，让
  # 产物（CLI binary、Docker、桌面安装档与更新描述档）的产出是全有全无。
  # CLI 与 server 的 binary 都不进 Release assets——各走自己的 npm 发布 job。
  release:
    needs: [build, desktop, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      # 组装脚本（scripts/release/release-latest-json.mjs）需要 repo 内容。
      - uses: actions/checkout@v5

      # Release assets 是封闭集合（desktop-release spec「Release 产出三平台桌面安装档」；
      # 设计 D1）：安装档＋更新包本体＋latest.json，共六个档。dist 只摊平合并
      # desktop-*；cli-*／server-* 各给自己的 npm 发布 job，不落入。
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # updater-* 保持目录结构下载，还原组装脚本的「每个更新包目录一更新包＋一 .sig」契约。
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater

      - name: Assemble latest.json (updater manifest)
        run: |
          cd updater
          for d in updater-*; do mv "$d" "${d#updater-}"; done
          cd ..
          node scripts/release/release-latest-json.mjs --tag "$GITHUB_REF_NAME" \
            --dir updater --repo "$GITHUB_REPOSITORY" --out dist/latest.json
          cat dist/latest.json

      # 更新包本体要能从 Release 下载（latest.json 的 url 指向它）；.sig 不上——
      # Tauri updater 只读 latest.json 内嵌的 signature 内容，发布后没有任何读者。
      # Windows／AppImage 的更新包与安装档同名同内容，覆盖无害；macOS 多出 .app.tar.gz。
      # 不再产校验码档：它唯一的机器读者（install.sh、formula 产生器）都改读 npm。
      - name: Add updater packages to Release assets (signatures stay out)
        run: |
          find updater -type f ! -name '*.sig' -exec cp {} dist/ \;
          ls -l dist

      # 下载指南前置于 Release 说明（desktop-release spec「Release 说明含下载指南」；
      # 设计 D7）：英文指南与英文更新日志片段在前，繁中指南与繁中片段收在「繁体中文」
      # 的 <details> 区块（release-notes.json 为真相）；
      # generate_release_notes 只剩最后的比较链接。notes.md 落在 workspace 根而非
      # dist/，不会被当成资产上传。
      - name: Download guide (release notes header)
        run: node scripts/release/release-notes.mjs --tag "$GITHUB_REF_NAME" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          generate_release_notes: true

  # CLI 的 npm 通路（cli-distribution spec「CLI 以 npm 套件发布」；设计 D4／D8）：binary 的
  # 唯一来源——install.sh 抓这里的 tgz、Homebrew formula 也指向这里。闸门、物化＋pack、幂等
  # 发布、等 registry 可见都在共用的 npm-publish.yml（三条 npm 通路同一份）；这里只给差异：
  # 下载 cli-*、以 npm-cli-package.mjs 物化、把 tgz 校验清单以 cli-npm-sums artifact 交给
  # tap-publish，并以 published 输出告知它「formula 指向的 tgz 到底在不在」。
  cli-npm-publish:
    needs: [release]
    uses: ./.github/workflows/npm-publish.yml
    with:
      artifacts: cli-*
      materialize: scripts/npm/npm-cli-package.mjs
      main-package: '@speclink/cli'
      sums-artifact: cli-npm-sums
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Formula 随发版自动推送 tap（cli-distribution spec；设计 D5／D8）。排在 Release 与
  # CLI 的 npm 发布之后：formula 的 url 指向 registry 上的平台 tgz，sha256 算在
  # cli-npm-publish 发布后自 registry 取回的那份 tgz 上；通路推送不是发布的前置条件，失败可单独
  # 重跑、不回溯撤销 Release。secrets 不能出现在 job 层级的 if，故以首步输出当双闸门
  # ——TAP_PUSH_TOKEN 缺席、或 CLI 因 NPM_TOKEN 缺席而未发布，后续步骤全部跳过、job 绿。
  tap-publish:
    needs: [release, cli-npm-publish]
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
      CLI_PUBLISHED: ${{ needs.cli-npm-publish.outputs.published }}
    steps:
      - name: Tap credential and npm publish gate
        id: gate
        shell: bash
        run: echo "enabled=$([ -n "$TAP_PUSH_TOKEN" ] && [ "$CLI_PUBLISHED" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: cli-npm-sums

      - name: Generate formula from npm tarball checksums
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/release/homebrew-formula.mjs --tag "$GITHUB_REF_NAME" --sums cli-npm-sums.txt > speclink.rb

      - name: Push formula to tap
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          TAP="${{ github.repository_owner }}/homebrew-tap"
          # 更新既有档要附现存 sha；首版（文件不存在）则不带。
          SHA=$(gh api "/repos/$TAP/contents/Formula/speclink.rb" --jq .sha 2>/dev/null || true)
          gh api -X PUT "/repos/$TAP/contents/Formula/speclink.rb" \
            -f message="speclink ${GITHUB_REF_NAME}" \
            -f "content=$(base64 -w0 speclink.rb)" \
            ${SHA:+-f "sha=$SHA"}

  # server 的 npm 通路（server-release spec「npm 套件一行启动 server」；设计 D9）：
  # 与 CLI 同一份共用 workflow，差异只有下载 server-* 与物化脚本。
  npm-publish:
    needs: [release]
    uses: ./.github/workflows/npm-publish.yml
    with:
      artifacts: server-*
      materialize: scripts/npm/npm-server-package.mjs
      main-package: '@speclink/server'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # tag 名去 v 前缀的版号：reusable workflow 的 with: 只吃表达式，而 Actions 表达式
  # 没有字符串裁切函数（无 replace／substring），只能由 shell 算成 job output 再传入。
  # 同时前置把关版号格式：盖章脚本只收 X.Y.Z，若留到 pack job 才挡，prerelease
  # tag 会白跑完五平台 matrix 才红灯——而那种 tag 在 engine 上通路前是全绿的。
  engine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.strip.outputs.version }}
      publishable: ${{ steps.strip.outputs.publishable }}
    steps:
      - name: Strip the v prefix and decide publishability
        id: strip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tag $GITHUB_REF_NAME 非 X.Y.Z，略过 engine 的 npm 建置与发布"
          fi

  # engine 的五平台建置与打包（node-sdk-release spec「build/pack workflow 可被 release
  # 管线重用」；设计 D1／D3）：以 workflow_call 重用 node-sdk.yml，不拷贝 build matrix。
  # 属同一个 workflow run，故盖章后的 npm-tarballs artifact 下方 job 直接下载得到。
  engine-npm-build:
    needs: [engine-version]
    if: needs.engine-version.outputs.publishable == 'true'
    uses: ./.github/workflows/node-sdk.yml
    with:
      version: ${{ needs.engine-version.outputs.version }}

  # engine 的 npm 通路（node-sdk-release spec「npm 发布闸门与发布顺序」；设计 D3）：
  # 同一份共用 workflow；发布单位是 node-sdk.yml 打包好的 npm-tarballs（主套件 tarball 在根、
  # 平台子套件在 npm/<平台>/），不传 materialize，发布端不重新打包。
  engine-npm-publish:
    needs: [engine-npm-build, release]
    uses: ./.github/workflows/npm-publish.yml
    with:
      artifacts: npm-tarballs
      main-package: '@speclink/engine'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
